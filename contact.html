<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/avif" href="/images/red.avif">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altf4.in</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
a{-webkit-tap-highlight-color:transparent;}

body{padding-top:170px;}

.top-header{
height:120px;
background:#0b0b0b;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 60px;
position:fixed;
width:100%;
top:0;
left:0;
z-index:1000;
}

/* NAV LEFT */
.nav-left a{
color:#d6d6d6;
text-decoration:none;
margin-right:40px;
font-family:sans-serif;
font-size:16px;
}
.nav-left a:hover{color:white;}
.nav-left .active{
color:white;
border-bottom:2px solid white;
padding-bottom:4px;
}

/* LOGO */
.nav-logo img{
width:110px;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* RIGHT ICONS */
.nav-right{
display:flex;
gap:30px;
font-size:22px;
color:white;
}
.nav-right a{color:white;text-decoration:none;}
.nav-right a:hover{color:#cfcfcf;}

/* DELIVERY BAR */
.Delivery-bar{
background:lightgray;
height:50px;
width:100%;
position:fixed;
top:120px;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
}
.head{color:black;font-size:20px;}

/* MOBILE MENU */
.menu-overlay{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: #0b0b0b;
    z-index: 2000;

    display: flex;
    flex-direction: column;
    will-change: transform;
    transform: translateX(-100%); /* hidden left */
    opacity: 0;

    transition: transform 0.4s ease, opacity 0.3s ease;
}

.menu-overlay.active{
    transform: translateX(0); /* slide in */
    opacity: 1;
}

.menu-top{
    padding: 15px 20px;
    position: relative;
}
.menu-logo{
    position: absolute;
    left: 50%;
    top: 15px;
    transform: translateX(-50%);
}

.menu-logo img{
    width: 70px;
}

/* CLOSE BUTTON */


.close-btn{
    position: absolute;
    left: 15px;
    top: 15px;
    font-size: 22px;
    z-index: 10;
}

/* DELIVERY BAR */
.menu-delivery{
background:lightgray;
color:black;
text-align:center;
padding:12px;
font-size:14px;
}
.menu-icons{
    position: absolute;
    right: 15px;
    top: 15px;
    display: flex;
    gap: 18px;
    font-size: 20px;
}
/* LINKS CENTER */
.menu-links{
    margin-top: 80px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
}

.menu-links{
    margin-top: 80px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    flex: 1; /* THIS pushes bottom down */
}
.menu-links a:first-child{
    background: #111;
}
/* BOTTOM */
.menu-bottom{
    padding: 20px;
    border-top: 1px solid #111;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.menu-bottom a{
    color: white;
    text-decoration: none;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
}
/* SEARCH */
.search-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:rgba(0,0,0,0.95);
z-index:3000;
display:none;
}
#searchOverlay:target{
display:flex;
align-items:flex-start;
justify-content:center;
}

.search-container{
display:flex;
gap:10px;
width:90%;
max-width:700px;
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
}

.search-box input{
width:100%;
height:45px;
padding:0 45px 0 15px;
background:#0b0b0b;
border:2px solid white;
color:white;
}
/* CONTACT SECTION */
.about-section {
    background: white;
    padding: 100px 0;
    font-family: sans-serif;
}

.about-title {
    text-align: center;
    font-size: 60px;
    font-weight: 300;
    margin-bottom: 60px;
}

.about-info {
    width: 55%;
    margin: 0 auto 60px auto;
    color: #444;
    line-height: 30px;
    font-size: 18px;
}

.contact-form {
    width: 55%;
    margin: auto;
}

.row {
    display: flex;
    gap: 30px;
}

.row .input-box {
    width: 50%;
}

.input-box {
    position: relative;
    margin-bottom: 25px;
}

.input-box input,
.input-box textarea {
    width: 100%;
    padding: 20px 12px;
    border: 1px solid #999;
    background: transparent;
    font-size: 16px;
    outline: none;
}

.input-box input:focus,
.input-box textarea:focus {
    border: 1px solid black;
    box-shadow: 0 0 0 1px black;
}

.input-box label {
    position: absolute;
    left: 12px;
    top: 20px;
    color: #666;
    font-size: 16px;
    pointer-events: none;
    transition: 0.25s;
    background: white;
    padding: 0 5px;
}

.input-box input:focus + label,
.input-box input:valid + label,
.input-box textarea:focus + label,
.input-box textarea:valid + label {
    top: -10px;
    font-size: 13px;
    color: black;
    background: #efefef;
}

.input-box textarea {
    height: 150px;
    resize: none;
}

.contact-form button {
    background: black;
    color: white;
    border: none;
    padding: 16px 45px;
    font-size: 16px;
    cursor: pointer;
    transition: .3s;
}

.contact-form button:hover {
    background: #222;
}

/* FOOTER */
.footer {
    background: #0b0b0b;
    color: white;
    text-align: center;
    padding: 80px 20px 30px;
    font-family: sans-serif;
}

.footer-title {
    font-size: 28px;
    margin-bottom: 25px;
}

.footer-links {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 40px;
}

.footer-links a {
    color: #cfcfcf;
    text-decoration: none;
    font-size: 14px;
}

.footer-links a:hover {
    color: white;
    text-decoration: underline;
}

.footer-instagram {
    font-size: 24px;
    margin-bottom: 50px;
}

.footer-instagram a {
    color: white;
}

.footer-bottom {
    border-top: 1px solid #222;
    padding-top: 20px;
    font-size: 13px;
    color: #aaa;
}

.footer-bottom a {
    color: #aaa;
    text-decoration: none;
}

.footer-bottom a:hover {
    color: white;
    border-bottom: 2px solid white;
}

/* MOBILE FIX */
@media(max-width:768px){

.about-section {
    padding: 60px 20px;
}

.about-title {
    font-size: 40px;
}

.about-info {
    width: 100%;
    font-size: 16px;
    line-height: 26px;
}

.contact-form {
    width: 100%;
}

.row {
    flex-direction: column;
    gap: 0;
}

.row .input-box {
    width: 100%;
}

.footer-links {
    flex-direction: column;
    gap: 15px;
}

.footer {
    padding: 60px 20px 20px;
}

.footer-bottom {
    font-size: 12px;
}
}

}
</style>

<!-- JS -->
<script>
    function openSearch() {
document.getElementById("searchOverlay").classList.add("active");
}

function closeSearch() {
document.getElementById("searchOverlay").classList.remove("active");
}
    let scrollPosition = 0;

    function toggleMenu() {
const menu = document.getElementById("menuOverlay");
const icon = document.getElementById("menuIcon");
const delivery = document.querySelector(".Delivery-bar");

menu.classList.toggle("active");

if (menu.classList.contains("active")) {
    scrollPosition = window.scrollY;

    document.body.style.position = "fixed";
    document.body.style.top = `-${scrollPosition}px`;
    document.body.style.width = "100%";

    icon.classList.replace("fa-bars", "fa-xmark");
    delivery.style.display = "none";
} else {
    document.body.style.position = "";
    document.body.style.top = "";
    document.body.style.width = "";

    window.scrollTo(0, scrollPosition);

    icon.classList.replace("fa-xmark", "fa-bars");
    delivery.style.display = "flex";
}
}
</script>
